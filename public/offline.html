<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#07070b" />
<title>Офлайн — NEONWAVE</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .offline-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
  }
  .offline-icon {
    font-size: 64px;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 24px rgba(0,229,255,.5));
  }
  .offline-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .offline-text { color: var(--text-dim); font-size: 14.5px; margin-bottom: 26px; max-width: 380px; }
</style>
</head>
<body>
  <div class="ambient"></div>
  <div class="grain"></div>
  <div class="offline-wrap">
    <div>
      <div class="offline-icon">📡</div>
      <h1 class="offline-title">Немає з'єднання</h1>
      <p class="offline-text">Перевірте інтернет-з'єднання та спробуйте знову. Раніше завантажені сторінки доступні офлайн.</p>
      <button class="btn-primary" style="width:auto;padding:12px 28px" onclick="location.reload()">Спробувати знову</button>
    </div>
  </div>
</body>
</html>
