<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070b"/>
      <stop offset="100%" stop-color="#12121c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="55%" stop-color="#b14cff"/>
      <stop offset="100%" stop-color="#ff3d9a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <g transform="translate(256 256)">
      <path d="M0 -110 L26 -30 L110 -30 L44 22 L70 104 L0 55 L-70 104 L-44 22 L-110 -30 L-26 -30 Z"
            fill="none" stroke="url(#neon)" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="34" fill="url(#neon)"/>
      <circle cx="0" cy="0" r="16" fill="#07070b"/>
    </g>
  </g>

  <g opacity="0.85" fill="url(#neon)">
    <rect x="150" y="360" width="10" height="40" rx="5"/>
    <rect x="176" y="335" width="10" height="90" rx="5"/>
    <rect x="202" y="370" width="10" height="20" rx="5"/>
    <rect x="228" y="320" width="10" height="120" rx="5"/>
    <rect x="254" y="350" width="10" height="60" rx="5"/>
    <rect x="280" y="310" width="10" height="140" rx="5"/>
    <rect x="306" y="355" width="10" height="50" rx="5"/>
    <rect x="332" y="330" width="10" height="100" rx="5"/>
    <rect x="358" y="370" width="10" height="20" rx="5"/>
  </g>
</svg>
